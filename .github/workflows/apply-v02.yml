name: Finalize Cat's tower V0.2 verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v02.yml

permissions:
  contents: write

concurrency:
  group: finalize-cats-v02
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make the public defense interaction test follow the moving enemy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/recovery-smoke.mjs')
          text = path.read_text()
          old = '''await defense.page.locator('[data-tool="static"]').tap();
          await defense.page.locator('.floor[data-no="1"]').tap();
          await defense.page.waitForTimeout(250);'''
          new = '''await defense.page.locator('[data-tool="static"]').tap();
          const toolTargetFloor = await defense.page.locator('.enemy').evaluate(
            (enemy) => enemy.closest('.floor')?.dataset.no,
          );
          assert(toolTargetFloor, 'Tool target floor was not found');
          await defense.page.locator(`.floor[data-no="${toolTargetFloor}"]`).tap();
          await defense.page.waitForTimeout(250);'''
          if old not in text:
              raise SystemExit('Expected recovery test block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate final V0.2 sources
        run: |
          set -euo pipefail
          node --check app.js
          node --check tests/mobile-smoke.mjs
          node --check tests/battle-smoke.mjs
          node --check tests/recovery-smoke.mjs
          grep -q "AID_CAP=120" app.js
          grep -q "id=\"battleCall\"" index.html

      - name: Commit the verification fix and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/recovery-smoke.mjs
          git rm .github/workflows/apply-v02.yml
          git commit -m "stabilize public first-defense mobile verification"
          git push origin HEAD:main
