name: Verify Cat's tower raster illustrations publicly

on:
  push:
    branches:
      - main
    paths:
      - tests/raster-public-smoke.mjs
      - .github/workflows/verify-raster-public.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-cats-raster-public
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for final raster source to reach public main
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            if curl --fail --silent --show-error --output /tmp/cats-raster-app.js "https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/app.js?attempt=${attempt}"; then
              if grep -Fq "const V='0.3.0'" /tmp/cats-raster-app.js && grep -Fq "raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-mugi.webp" /tmp/cats-raster-app.js; then
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Raster source did not reach public main within the timeout" >&2
          exit 1

      - name: Install mobile browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Verify the Vercel smartphone build
        env:
          CATS_TEST_URL: https://cats-tau-dusky.vercel.app
        run: |
          set -euo pipefail
          CATS_BROWSER=chromium CATS_TEST_OUT=test-results/raster-chromium node tests/raster-public-smoke.mjs
          CATS_BROWSER=webkit CATS_TEST_OUT=test-results/raster-webkit node tests/raster-public-smoke.mjs

      - name: Upload raster verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cats-raster-public-verification
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Record successful public verification and remove one-time test files
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > RASTER_ART_VERIFIED.md <<EOF
          # Cat's tower raster art verification

          - Public URL: https://cats-tau-dusky.vercel.app
          - Chromium mobile test: passed
          - WebKit mobile test: passed
          - Verified commit: ${GITHUB_SHA}
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add RASTER_ART_VERIFIED.md
          git rm tests/raster-public-smoke.mjs .github/workflows/verify-raster-public.yml
          git commit -m "verify raster illustrations on the public mobile build"
          git push origin HEAD:main
