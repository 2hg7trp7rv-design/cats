name: Bump Cat's tower character assets v0.6.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-cat-assets-v061.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bust stale character caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("const V='0.6.0'", "const V='0.6.1'", 1)
          for name in ('mugi','luna','toto','mimi'):
              s=s.replace(f'cat-{name}.webp?v=6"', f'cat-{name}.webp?v=061-20260815"')
          p.write_text(s)
          PY
          node --check app.js
          grep -Fq "const V='0.6.1'" app.js
          grep -Fq 'cat-mugi.webp?v=061-20260815' app.js
          grep -Fq 'cat-toto.webp?v=061-20260815' app.js
          grep -Fq 'cat-mimi.webp?v=061-20260815' app.js
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git rm .github/workflows/bump-cat-assets-v061.yml
          git commit -m 'bust stale character image caches v0.6.1'
          git pull --rebase origin main
          git push origin HEAD:main
