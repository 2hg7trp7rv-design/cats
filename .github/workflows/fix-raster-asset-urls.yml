name: Fix Cat's tower raster asset URLs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-raster-asset-urls.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-cats-raster-asset-urls
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make raster assets work through the current Vercel wrapper
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          raw = 'https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/'
          for name in ('app.js', 'styles.css'):
              path = Path(name)
              text = path.read_text()
              text = re.sub(r'(?<!/main/)assets/illustrations/', raw, text)
              path.write_text(text)
          PY

      - name: Validate public image paths
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-mugi.webp" app.js
          grep -Fq "https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/title-hero.webp" styles.css

      - name: Commit URL fix and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css
          git rm .github/workflows/fix-raster-asset-urls.yml
          git commit -m "serve raster illustrations through the public wrapper"
          git push origin HEAD:main
