name: Apply Living Tower V0.9 raster assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-living-v09.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cats-living-v09-assets
  cancel-in-progress: false

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install raster runtime
        run: python3 -m pip install --quiet pillow

      - name: Build illustrated plush dollhouse assets
        run: python3 scripts/build_living_v09.py

      - name: Validate final raster contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'cat-mugi-living-v09.webp': (1024, 1024),
              'title-living-v09.webp': (1170, 2532),
              'roof-v09.webp': (1280, 520),
              'room-food-v09.webp': (1280, 760),
              'room-home-v09.webp': (1280, 760),
              'room-lobby-v09.webp': (1280, 760),
              'room-craft-v09.webp': (1280, 760),
              'room-play-v09.webp': (1280, 760),
              'room-care-v09.webp': (1280, 760),
          }
          root = Path('assets/living')
          for name, size in expected.items():
              p = root / name
              assert p.exists() and p.stat().st_size > 8000, (name, 'missing or too small')
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP', (name, im.format)
                  assert im.size == size, (name, im.size)
              head = p.read_bytes()[:12]
              assert head[:4] == b'RIFF' and head[8:12] == b'WEBP', (name, head)
              print(name, size, p.stat().st_size)
          assert not list(root.glob('*.svg'))
          PY

      - name: Commit generated assets and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "2hg7trp7rv-design"
          git config user.email "2hg7trp7rv@privaterelay.appleid.com"
          git add assets/living scripts/build_living_v09.py
          git rm .github/workflows/apply-living-v09.yml
          git commit -m "build Living Tower V0.9 raster art assets"
          git push origin HEAD:main
