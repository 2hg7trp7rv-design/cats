name: Apply Cat's tower raster game art

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_raster_art.py
      - .github/workflows/apply-raster-art.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cats-raster-art
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install illustration runtime
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate raster game illustrations and patch the game
        run: python scripts/generate_raster_art.py

      - name: Validate generated build
        run: |
          set -euo pipefail
          node --check app.js
          grep -q "const V='0.3.0'" app.js
          grep -q "class=\\\"catSprite" app.js
          grep -q "assets/illustrations/enemy-robot.webp" app.js
          grep -q "RASTER_ART_V03_START" styles.css
          grep -q "V0.3 · RASTER ILLUSTRATION BUILD" index.html
          test -s assets/illustrations/title-hero.webp
          test -s assets/illustrations/cat-mugi.webp
          test -s assets/illustrations/cat-luna.webp
          test -s assets/illustrations/cat-toto.webp
          test -s assets/illustrations/cat-mimi.webp
          test -s assets/illustrations/enemy-shadow.webp
          test -s assets/illustrations/enemy-robot.webp
          test -s assets/illustrations/enemy-burglar.webp
          test -s assets/illustrations/room-lobby.webp
          test -s assets/illustrations/room-home.webp
          test -s assets/illustrations/room-food.webp
          test -s assets/illustrations/room-play.webp
          test -s assets/illustrations/room-care.webp
          test -s assets/illustrations/room-craft.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('assets/illustrations').glob('*.webp'))
          assert len(files) >= 14, len(files)
          for path in files:
              with Image.open(path) as image:
                  image.verify()
              assert path.stat().st_size > 1000, path
          print('verified', len(files), 'raster illustrations')
          PY

      - name: Commit only the production raster build to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js assets/illustrations
          git rm -r --ignore-unmatch scripts/raster_lite_parts scripts/raster_payload_parts scripts/raster_assets_parts
          git rm --ignore-unmatch scripts/generate_raster_art.py .github/workflows/apply-raster-art.yml
          git commit -m "replace SVG prototype art with raster game illustrations"
          git push origin HEAD:main
