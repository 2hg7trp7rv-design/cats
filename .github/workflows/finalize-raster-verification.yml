name: Finalize Cat's tower raster verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-raster-verification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-cats-raster-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the raster build and verify every public asset
        run: |
          set -euo pipefail
          raw='https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/'
          for attempt in {1..120}; do
            if curl -fsSL "${raw}app.js?attempt=${attempt}" -o /tmp/app.js && grep -Fq "const V='0.3.0'" /tmp/app.js && grep -Fq "${raw}assets/illustrations/cat-mugi.webp" /tmp/app.js; then
              break
            fi
            sleep 4
          done
          grep -Fq "const V='0.3.0'" /tmp/app.js
          for name in title-hero cat-mugi cat-luna cat-toto cat-mimi enemy-shadow enemy-robot enemy-burglar room-lobby room-home room-food room-play room-care room-craft; do
            curl -fsSL "${raw}assets/illustrations/${name}.webp?check=${GITHUB_RUN_ID}" -o "/tmp/${name}.webp"
            test "$(wc -c < "/tmp/${name}.webp")" -gt 1000
          done
          curl -fsSL https://cats-tau-dusky.vercel.app -o /tmp/public.html
          grep -Fq "Cat's tower" /tmp/public.html

      - name: Install mobile browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Test raster illustrations in Chromium and WebKit
        env:
          CATS_TEST_URL: https://cats-tau-dusky.vercel.app
        run: |
          cat > /tmp/raster-check.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          const url = process.env.CATS_TEST_URL;
          for (const [name, type] of Object.entries({ chromium, webkit })) {
            const browser = await type.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 }, screen: { width: 390, height: 844 },
              deviceScaleFactor: 3, isMobile: true, hasTouch: true, locale: 'ja-JP',
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            assert(response?.ok(), `${name}: HTTP ${response?.status()}`);
            await page.locator('#startBtn').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('#splashCat img.catSprite').waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelector('#splashCat img')?.naturalWidth > 0, null, { timeout: 30000 });
            const titleBg = await page.locator('#splash').evaluate(n => getComputedStyle(n).backgroundImage);
            assert.match(titleBg, /title-hero\.webp/);
            await page.locator('#startBtn').tap();
            await page.locator('#game:not(.hidden)').waitFor({ state: 'visible', timeout: 15000 });
            const intro = page.locator('[data-a="intro"]'); if (await intro.count()) await intro.tap();
            const close = page.locator('[data-a="coach-close"]'); if (await close.count()) await close.tap();
            await page.locator('.cat img.catSprite').first().waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => [...document.querySelectorAll('.cat img.catSprite')].every(i => i.complete && i.naturalWidth > 0), null, { timeout: 30000 });
            const roomBg = await page.locator('.floor.food').evaluate(n => getComputedStyle(n).backgroundImage);
            assert.match(roomBg, /room-food\.webp/);
            const battle = page.locator('#battleCall:not(.hidden)');
            await battle.waitFor({ state: 'visible', timeout: 15000 });
            await battle.tap();
            await page.locator('.enemy img').waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => document.querySelector('.enemy img')?.naturalWidth > 0, null, { timeout: 30000 });
            assert.deepEqual(errors, [], `${name}: ${errors.join(' | ')}`);
            await page.screenshot({ path: `/tmp/cats-raster-${name}.png`, fullPage: true });
            await browser.close();
          }
          JS
          node /tmp/raster-check.mjs

      - name: Record verification on the newest main and clean one-time files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > RASTER_ART_VERIFIED.md <<EOF
          # Cat's tower raster art verification

          - Public URL: https://cats-tau-dusky.vercel.app
          - Raster character illustrations: verified
          - Raster enemy illustrations: verified
          - Illustrated room backgrounds: verified
          - Chromium mobile: passed
          - WebKit mobile: passed
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add RASTER_ART_VERIFIED.md
          git rm --ignore-unmatch tests/raster-public-smoke.mjs
          git rm --ignore-unmatch .github/workflows/verify-raster-public.yml .github/workflows/finalize-raster-verification.yml
          git commit -m "verify raster illustrations on the public mobile build"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 3
          done
          exit 1
