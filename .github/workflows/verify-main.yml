name: Verify Cat's tower V0.8 main

on:
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - PROJECT_HANDOVER.md
      - PROJECT_STATUS.json
      - index.html
      - styles.css
      - app.js
      - sw.js
      - manifest.webmanifest
      - assets/v080/**
      - assets/icons/**
      - tests/living-tower-v080.mjs
      - scripts/build_v080_art.py
      - .github/workflows/verify-main.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-v080-main-qa
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repository handover and source contracts
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s PROJECT_HANDOVER.md
          test -s PROJECT_STATUS.json
          test -s README.md
          test ! -e .v080
          test ! -e test
          test ! -e art.css
          test ! -e art.js
          test ! -e icon.svg
          test ! -e visual-fix-v04.css
          test ! -e character-assets-v06.js
          test ! -d node_modules
          test ! -d test-results
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "verify-main.yml"
          test "$(find tests -maxdepth 1 -type f -printf '%f\n' | sort)" = "living-tower-v080.mjs"
          test "$(find scripts -maxdepth 1 -type f -printf '%f\n' | sort)" = "build_v080_art.py"
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('PROJECT_STATUS.json').read_text())
          assert status['canonicalVersion']=='0.8.0'
          assert status['canonicalBranch']=='main'
          assert status['physicalIPhoneVerified'] is False
          assert status['artProductionReady'] is False
          assert status['productionUrl']=='https://cats-tau-dusky.vercel.app/'
          print('handover contracts passed')
          PY

      - name: Static and raster asset contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          node --check app.js
          node --check sw.js
          node --check tests/living-tower-v080.mjs
          grep -q "const VERSION='0.8.0'" app.js
          grep -q "V0.8 · LIVING TOWER VERTICAL SLICE" index.html
          grep -q "/assets/v080/title-live-v080.webp" index.html
          ! grep -q "RASTER_ART_V03_START" styles.css
          ! grep -q "V04_MOBILE_VISUAL_FIX_START" styles.css
          ! grep -q "V05_CHARACTER_ART_START" styles.css
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected={
            'mugi-v080.webp':(512,512),
            'mugi-sleep-v080.webp':(512,512),
            'room-food-v080.webp':(1024,720),
            'room-home-v080.webp':(1024,720),
            'room-lobby-v080.webp':(1024,720),
            'room-roof-v080.webp':(1024,720),
            'room-food-night-v080.webp':(1024,720),
            'title-live-v080.webp':(768,1365),
            'memory-first-home-v080.webp':(1024,720),
          }
          for name,size in expected.items():
            path=Path('assets/v080')/name
            assert path.is_file() and path.stat().st_size>5000,(name,'missing or too small')
            with Image.open(path) as image:
              image.load()
              assert image.format=='WEBP',(name,image.format)
              assert image.size==size,(name,image.size,size)
          for name,size in {'icon-192.png':(192,192),'icon-512.png':(512,512)}.items():
            path=Path('assets/icons')/name
            assert path.is_file() and path.stat().st_size>5000,(name,'missing or too small')
            with Image.open(path) as image:
              image.load()
              assert image.format=='PNG',(name,image.format)
              assert image.size==size,(name,image.size,size)
          print('V0.8 raster contracts passed')
          PY

      - name: Install mobile browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Chromium and WebKit Living Tower QA
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/cats-v080-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CATS_BROWSER=chromium CATS_TEST_OUT=test-results/v080-chromium node tests/living-tower-v080.mjs
          CATS_BROWSER=webkit CATS_TEST_OUT=test-results/v080-webkit node tests/living-tower-v080.mjs

      - name: Upload V0.8 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cats-v080-main-evidence
          path: test-results
          if-no-files-found: warn
          retention-days: 14
