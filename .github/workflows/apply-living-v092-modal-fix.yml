name: Apply Living Tower V0.9.2 modal repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-living-v092-modal-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cats-living-v092-modal-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch modal interaction and cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); text=p.read_text()
              n=text.count(old)
              if count is not None and n != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, got {n}')
              if n == 0:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(text.replace(old,new))

          replace('app.js', "const V='0.9.1';", "const V='0.9.2';", 1)
          replace(
              'app.js',
              "const close=event.target.closest('[data-close]');if(close)return closeSheet();if(event.target.classList.contains('shade')&&event.target.dataset.close)return closeSheet();",
              "const close=event.target.closest('button[data-close]');if(close)return closeSheet();if(event.target.classList.contains('shade')&&event.target.dataset.close)return closeSheet();",
              1
          )
          replace('index.html', 'manifest.webmanifest?v=091', 'manifest.webmanifest?v=092', 1)
          replace('index.html', 'styles.css?v=091', 'styles.css?v=092', 1)
          replace('index.html', 'V0.9.1 · LIVING TOWER VERTICAL SLICE', 'V0.9.2 · LIVING TOWER VERTICAL SLICE', 1)
          replace('index.html', 'app.js?v=091', 'app.js?v=092', 1)
          replace('sw.js', "const CACHE='cats-tower-living-v091';", "const CACHE='cats-tower-living-v092';", 1)
          replace('sw.js', '/styles.css?v=091', '/styles.css?v=092', 1)
          replace('sw.js', '/app.js?v=091', '/app.js?v=092', 1)
          replace('sw.js', '/manifest.webmanifest?v=091', '/manifest.webmanifest?v=092', 1)
          replace('tests/living-v09.mjs', "await page.locator('#modal [data-close=\"1\"]').first().tap();", "await page.locator('#modal button[data-close=\"1\"]').tap();", 1)
          PY

      - name: Validate repair
        run: |
          set -euo pipefail
          node --check app.js
          node --check tests/living-v09.mjs
          grep -q "const V='0.9.2'" app.js
          grep -q "button\[data-close\]" app.js
          grep -q "V0.9.2" index.html
          grep -q "cats-tower-living-v092" sw.js
          ! grep -q "closest('\[data-close\]')" app.js

      - name: Commit non-workflow repair
        run: |
          set -euo pipefail
          git config user.name "2hg7trp7rv-design"
          git config user.email "2hg7trp7rv@privaterelay.appleid.com"
          git add app.js index.html sw.js tests/living-v09.mjs
          git commit -m "repair Living Tower V0.9.2 modal interactions"
          git push origin HEAD:main
