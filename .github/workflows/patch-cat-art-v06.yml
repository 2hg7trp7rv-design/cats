name: Patch Cat's tower character assets v0.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-cat-art-v06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace embedded character data with stable WebP assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("const V='0.5.0'", "const V='0.6.0'", 1)
          replacement="const CAT_ART={\"mugi\":\"https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-mugi.webp?v=6\",\"luna\":\"https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-luna.webp?v=6\",\"toto\":\"https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-toto.webp?v=6\",\"mimi\":\"https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-mimi.webp?v=6\"},ENEMY_ART="
          s,n=re.subn(r"const CAT_ART=\{.*?\},ENEMY_ART=", replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('CAT_ART block not found exactly once')
          p.write_text(s)
          PY
          node --check app.js
          grep -Fq "const V='0.6.0'" app.js
          grep -Fq 'cat-toto.webp?v=6' app.js
          grep -Fq 'cat-mimi.webp?v=6' app.js
          if grep -Fq 'data:image/webp;base64' app.js; then
            echo 'Embedded cat base64 still present' >&2
            exit 1
          fi

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git rm .github/workflows/patch-cat-art-v06.yml
          git commit -m 'fix corrupted character delivery on Safari'
          git pull --rebase origin main
          git push origin HEAD:main
