name: Definitive Cat's tower raster build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/definitive-raster-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: definitive-cats-raster-build
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate raster illustrations when still pending
        run: |
          set -euo pipefail
          if ! grep -Fq "const V='0.3.0'" app.js || [ ! -s assets/illustrations/title-hero.webp ]; then
            test -s scripts/generate_raster_art.py
            python -m pip install --disable-pip-version-check pillow==11.3.0
            python scripts/generate_raster_art.py
          fi

      - name: Normalize public raster URLs for the Vercel wrapper
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          raw = 'https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/'
          for name in ('app.js', 'styles.css'):
              p = Path(name)
              text = p.read_text()
              text = re.sub(r'(?<!/main/)assets/illustrations/', raw, text)
              p.write_text(text)
          PY

      - name: Validate and publish production source if needed
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "const V='0.3.0'" app.js
          grep -Fq "catSprite" app.js
          grep -Fq "raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-mugi.webp" app.js
          grep -Fq "raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/title-hero.webp" styles.css
          for name in title-hero cat-mugi cat-luna cat-toto cat-mimi enemy-shadow enemy-robot enemy-burglar room-lobby room-home room-food room-play room-care room-craft; do test -s "assets/illustrations/${name}.webp"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js assets/illustrations
          if ! git diff --cached --quiet; then
            git commit -m "implement raster game illustrations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Wait for published source
        run: |
          set -euo pipefail
          raw='https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/'
          for attempt in {1..120}; do
            if curl -fsSL "${raw}app.js?attempt=${attempt}" -o /tmp/app.js && grep -Fq "const V='0.3.0'" /tmp/app.js && grep -Fq "${raw}assets/illustrations/cat-mugi.webp" /tmp/app.js; then exit 0; fi
            sleep 4
          done
          exit 1

      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Verify public smartphone rendering in Chromium and WebKit
        run: |
          cat > /tmp/check.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          const url='https://cats-tau-dusky.vercel.app';
          for (const [name,type] of Object.entries({chromium,webkit})) {
            const browser=await type.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,locale:'ja-JP',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000}); assert(response?.ok(),`${name} HTTP ${response?.status()}`);
            await page.locator('#startBtn').waitFor({state:'visible',timeout:30000});
            await page.locator('#splashCat img.catSprite').waitFor({state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#splashCat img')?.naturalWidth>0,null,{timeout:30000});
            assert.match(await page.locator('#splash').evaluate(n=>getComputedStyle(n).backgroundImage),/title-hero\.webp/);
            await page.locator('#startBtn').tap(); await page.locator('#game:not(.hidden)').waitFor({state:'visible',timeout:15000});
            const intro=page.locator('[data-a="intro"]'); if(await intro.count()) await intro.tap(); const close=page.locator('[data-a="coach-close"]'); if(await close.count()) await close.tap();
            await page.locator('.cat img.catSprite').first().waitFor({state:'visible',timeout:30000});
            await page.waitForFunction(()=>[...document.querySelectorAll('.cat img.catSprite')].every(i=>i.complete&&i.naturalWidth>0),null,{timeout:30000});
            assert.match(await page.locator('.floor.food').evaluate(n=>getComputedStyle(n).backgroundImage),/room-food\.webp/);
            const battle=page.locator('#battleCall:not(.hidden)'); await battle.waitFor({state:'visible',timeout:15000}); await battle.tap();
            await page.locator('.enemy img').waitFor({state:'visible',timeout:15000}); await page.waitForFunction(()=>document.querySelector('.enemy img')?.naturalWidth>0,null,{timeout:30000});
            assert.deepEqual(errors,[],`${name}: ${errors.join(' | ')}`); await browser.close();
          }
          JS
          node /tmp/check.mjs

      - name: Record success and remove all temporary implementation files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > RASTER_ART_VERIFIED.md <<EOF
          # Cat's tower raster art verification

          - Public URL: https://cats-tau-dusky.vercel.app
          - SVG character prototypes replaced by raster game illustrations
          - Plush cat sprites, enemy sprites, title artwork and six room illustrations verified
          - Chromium mobile rendering: passed
          - WebKit mobile rendering: passed
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add RASTER_ART_VERIFIED.md
          git rm -r --ignore-unmatch scripts/raster_lite_parts scripts/raster_payload_parts scripts/raster_assets_parts
          git rm --ignore-unmatch scripts/generate_raster_art.py tests/raster-public-smoke.mjs
          git rm --ignore-unmatch .github/workflows/apply-raster-art.yml .github/workflows/repair-raster-art.yml .github/workflows/fix-raster-asset-urls.yml .github/workflows/verify-raster-public.yml .github/workflows/finalize-raster-verification.yml .github/workflows/definitive-raster-build.yml
          git commit -m "verify raster game illustrations on the public mobile build"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 3
          done
          exit 1
