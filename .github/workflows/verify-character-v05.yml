name: Verify Cat's tower v0.5 characters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-character-v05.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate repository state
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "const V='0.5.0'" app.js
          grep -Fq 'V05_CHARACTER_ART_START' styles.css
          for f in mugi luna toto mimi; do
            test -s "assets/illustrations/cat-${f}.webp"
            file "assets/illustrations/cat-${f}.webp" | grep -qi 'Web/P\|WebP'
          done

      - name: Embed four cat sprites in app source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re
          p=Path('app.js')
          s=p.read_text()
          art={}
          for name in ('mugi','luna','toto','mimi'):
              b=Path(f'assets/illustrations/cat-{name}.webp').read_bytes()
              if not (b[:4] == b'RIFF' and b[8:12] == b'WEBP'):
                  raise SystemExit(f'{name}: invalid WebP RIFF header')
              art[name]='data:image/webp;base64,'+base64.b64encode(b).decode('ascii')
          replacement='const CAT_ART='+json.dumps(art,separators=(',',':'))+',ENEMY_ART='
          s2,n=re.subn(r'const CAT_ART=\{.*?\},ENEMY_ART=',replacement,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('CAT_ART block not found')
          p.write_text(s2)
          PY
          node --check app.js
          grep -Fq 'data:image/webp;base64,' app.js

      - name: Publish embedded character build to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if ! git diff --cached --quiet; then
            git commit -m 'embed plush cat sprites for reliable mobile delivery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          for attempt in {1..60}; do
            if curl -fsSL "https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/app.js?charv5=${attempt}" -o /tmp/public-app.js \
              && grep -Fq 'data:image/webp;base64,' /tmp/public-app.js; then
              exit 0
            fi
            sleep 2
          done
          echo 'Embedded character app.js did not reach GitHub raw in time' >&2
          exit 1

      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Verify public Vercel build on mobile engines
        run: |
          cat > verify-cats.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          const url='https://cats-tau-dusky.vercel.app/?v=5&check=character-embedded';
          for (const [engine,type] of Object.entries({chromium,webkit})) {
            const browser=await type.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,locale:'ja-JP'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            assert(response?.ok(),`${engine} HTTP ${response?.status()}`);
            await page.locator('#startBtn').waitFor({state:'visible',timeout:30000});
            const dataUris=await page.evaluate(()=>{
              const text=[...document.scripts].map(s=>s.textContent||'').find(t=>t.includes('const CAT_ART='))||'';
              return text.match(/data:image\/webp;base64,[A-Za-z0-9+/=]+/g)||[];
            });
            assert(dataUris.length>=4,`${engine}: public wrapper did not load four embedded cat sprites`);
            const decoded=await page.evaluate(async uris=>Promise.all(uris.slice(0,4).map(src=>new Promise(resolve=>{
              const img=new Image();
              img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight});
              img.onerror=()=>resolve({w:0,h:0});
              img.src=src;
            }))),dataUris);
            for(const item of decoded) assert(item.w>0 && item.h>0,`${engine}: embedded WebP failed to decode`);
            await page.locator('#startBtn').tap();
            await page.locator('#game:not(.hidden)').waitFor({state:'visible',timeout:15000});
            const intro=page.locator('[data-a="intro"]'); if(await intro.count()) await intro.tap();
            const close=page.locator('[data-a="coach-close"]'); if(await close.count()) await close.tap();
            const mugi=page.locator('.cat img.catSprite').first();
            await mugi.waitFor({state:'visible',timeout:15000});
            assert((await mugi.getAttribute('src'))?.startsWith('data:image/webp;base64,'),`${engine}: gameplay Mugi is not using embedded art`);
            await page.waitForFunction(()=>document.querySelector('.cat img.catSprite')?.naturalWidth>0,null,{timeout:15000});
            assert.deepEqual(errors,[],`${engine}: ${errors.join(' | ')}`);
            await context.close();
            await browser.close();
          }
          JS
          node verify-cats.mjs
          rm -f verify-cats.mjs

      - name: Record verification and remove temporary workflow
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > MOBILE_V05_CHARACTERS_VERIFIED.md <<EOF
          # Cat's tower v0.5 character verification

          - Public URL: https://cats-tau-dusky.vercel.app/?v=5
          - Repository: 2hg7trp7rv-design/cats
          - Branch: main only
          - Mugi / Luna / Toto / Mimi plush WebP assets embedded in app.js
          - No external cat-image request required at runtime
          - V0.5 public app source loaded
          - Chromium mobile passed
          - WebKit mobile passed
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add MOBILE_V05_CHARACTERS_VERIFIED.md
          git rm .github/workflows/verify-character-v05.yml
          git commit -m 'verify Cat tower v0.5 plush character rendering'
          git pull --rebase origin main
          git push origin HEAD:main
