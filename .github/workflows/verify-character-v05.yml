name: Verify Cat's tower v0.5 characters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-character-v05.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate repository state
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "const V='0.5.0'" app.js
          grep -Fq 'V05_CHARACTER_ART_START' styles.css
          for f in mugi luna toto mimi; do test -s "assets/illustrations/cat-${f}.webp"; done

      - name: Install browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Verify public Vercel build on mobile engines
        run: |
          cat > /tmp/verify-cats.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          const url='https://cats-tau-dusky.vercel.app/?v=5&check=character';
          const names=['mugi','luna','toto','mimi'];
          for (const [engine,type] of Object.entries({chromium,webkit})) {
            const browser=await type.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true,locale:'ja-JP'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            assert(response?.ok(),`${engine} HTTP ${response?.status()}`);
            await page.locator('#startBtn').waitFor({state:'visible',timeout:30000});
            const version=await page.evaluate(()=>document.body.innerHTML.includes('v0.5') || [...document.scripts].some(s=>s.textContent?.includes("const V='0.5.0'")));
            assert(version,`${engine}: public wrapper did not load v0.5 app.js`);
            const loaded=await page.evaluate(async names=>{
              const base='https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/';
              return await Promise.all(names.map(name=>new Promise(resolve=>{
                const img=new Image(); img.onload=()=>resolve({name,w:img.naturalWidth,h:img.naturalHeight}); img.onerror=()=>resolve({name,w:0,h:0}); img.src=`${base}cat-${name}.webp?verify=5`;
              })));
            },names);
            for(const item of loaded) assert(item.w>0 && item.h>0,`${engine}: ${item.name} failed to load`);
            await page.locator('#startBtn').tap();
            await page.locator('#game:not(.hidden)').waitFor({state:'visible',timeout:15000});
            const mugi=page.locator('.cat img.catSprite').first();
            await mugi.waitFor({state:'visible',timeout:15000});
            assert((await mugi.getAttribute('src'))?.includes('cat-mugi.webp'),`${engine}: gameplay Mugi source not updated`);
            await page.waitForFunction(()=>document.querySelector('.cat img.catSprite')?.naturalWidth>0,null,{timeout:15000});
            assert.deepEqual(errors,[],`${engine}: ${errors.join(' | ')}`);
            await browser.close();
          }
          JS
          node /tmp/verify-cats.mjs

      - name: Record verification and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > MOBILE_V05_CHARACTERS_VERIFIED.md <<EOF
          # Cat's tower v0.5 character verification

          - Public URL: https://cats-tau-dusky.vercel.app/?v=5
          - Repository: 2hg7trp7rv-design/cats
          - Branch: main only
          - Mugi / Luna / Toto / Mimi raster WebP assets loaded
          - V0.5 public app source loaded
          - Chromium mobile passed
          - WebKit mobile passed
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add MOBILE_V05_CHARACTERS_VERIFIED.md
          git rm .github/workflows/verify-character-v05.yml
          git commit -m 'verify Cat tower v0.5 character rendering'
          git pull --rebase origin main
          git push origin HEAD:main
