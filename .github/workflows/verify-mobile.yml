name: Verify Cat's tower mobile V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - icon.svg
      - manifest.webmanifest
      - sw.js
      - vercel.json
      - tests/mobile-smoke.mjs
      - .github/workflows/verify-mobile.yml

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate static files
        run: |
          set -euo pipefail
          node --check app.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s icon.svg
          test ! -e 1

      - name: Install mobile browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps chromium webkit

      - name: Run local smartphone browser tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/cats-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          CATS_BROWSER=chromium CATS_TEST_OUT=test-results/local-chromium node tests/mobile-smoke.mjs
          CATS_BROWSER=webkit CATS_TEST_OUT=test-results/local-webkit node tests/mobile-smoke.mjs

      - name: Run Vercel smartphone browser tests
        env:
          CATS_TEST_URL: https://cats-tau-dusky.vercel.app
        run: |
          set -euo pipefail
          CATS_BROWSER=chromium CATS_TEST_OUT=test-results/vercel-chromium node tests/mobile-smoke.mjs
          CATS_BROWSER=webkit CATS_TEST_OUT=test-results/vercel-webkit node tests/mobile-smoke.mjs

      - name: Upload smartphone verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cats-mobile-smoke
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified deployable site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cats-site-main
          path: |
            index.html
            styles.css
            app.js
            icon.svg
            manifest.webmanifest
            sw.js
            vercel.json
          if-no-files-found: error
          retention-days: 14
