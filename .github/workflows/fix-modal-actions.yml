name: Fix bottom sheet actions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-modal-actions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct modal click routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = "function modalClick(e){const close=e.target.closest('[data-close]');if(close){if(close.classList.contains('shade')&&e.target!==close)return;return closeSheet()}const x=e.target.closest('[data-a]');"
          new = "function modalClick(e){const closeButton=e.target.closest('button[data-close]');if(closeButton)return closeSheet();if(e.target.classList.contains('shade')&&e.target.dataset.close)return closeSheet();const x=e.target.closest('[data-a]');"

          if old not in text:
              raise SystemExit('Expected modalClick implementation was not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js

      - name: Commit correction to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix bottom sheet actions on mobile"
          git push origin main
