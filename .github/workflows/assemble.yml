name: Assemble Cat's tower V0.1

on:
  push:
    branches:
      - main
    paths:
      - '.staging/**'
      - '.github/workflows/assemble.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct the complete repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .staging -maxdepth 1 -name 'bundle.part*' | wc -l)" -eq 5
          cat .staging/bundle.part* | base64 --decode | tar -xz
          node --check app.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool vercel.json >/dev/null
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s icon.svg
          rm -f 1
          rm -rf .staging
          rm -f .github/workflows/assemble.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit V0.1 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Cat's tower builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Cat's tower mobile V0.1 [skip ci]"
          git push origin HEAD:main
