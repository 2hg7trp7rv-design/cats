name: Verify Cat's tower character assets v0.6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-character-v06.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright@1.60.0
          npx playwright install --with-deps webkit chromium
      - name: Verify public game and all four character assets
        run: |
          cat > verify-v06.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import assert from 'node:assert/strict';
          const url='https://cats-tau-dusky.vercel.app/?v=6&verify=characters';
          const assets=['mugi','luna','toto','mimi'];
          for(const [name,type] of Object.entries({chromium,webkit})){
            const browser=await type.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const r=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            assert(r?.ok(),`${name}: public URL HTTP ${r?.status()}`);
            await page.locator('#startBtn').waitFor({state:'visible',timeout:30000});
            const loaded=await page.evaluate(async assets=>Promise.all(assets.map(id=>new Promise(resolve=>{
              const img=new Image();
              img.onload=()=>resolve({id,w:img.naturalWidth,h:img.naturalHeight});
              img.onerror=()=>resolve({id,w:0,h:0});
              img.src=`https://raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-${id}.webp?v=6`;
            }))),assets);
            for(const item of loaded) assert(item.w>0&&item.h>0,`${name}: ${item.id} image failed to decode`);
            await page.locator('#startBtn').tap();
            await page.locator('#game:not(.hidden)').waitFor({state:'visible',timeout:15000});
            const mugi=page.locator('img[alt="ムギ"]').first();
            await mugi.waitFor({state:'visible',timeout:15000});
            await page.waitForFunction(()=>document.querySelector('img[alt="ムギ"]')?.naturalWidth>0,null,{timeout:15000});
            assert.deepEqual(errors,[],`${name}: ${errors.join(' | ')}`);
            await browser.close();
          }
          JS
          node verify-v06.mjs
      - name: Record success and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > MOBILE_V06_CHARACTERS_VERIFIED.md <<EOF
          # Cat's tower v0.6 character verification
          - Public URL: https://cats-tau-dusky.vercel.app/?v=6
          - Chromium mobile: PASS
          - WebKit mobile: PASS
          - Mugi / Luna / Toto / Mimi WebP decode: PASS
          - Embedded character Base64 removed from app.js
          - Verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add MOBILE_V06_CHARACTERS_VERIFIED.md
          git rm .github/workflows/verify-character-v06.yml
          git commit -m 'verify v0.6 character rendering on mobile engines'
          git pull --rebase origin main
          git push origin HEAD:main
