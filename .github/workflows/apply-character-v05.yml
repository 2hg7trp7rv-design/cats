name: Apply Cat's tower v0.5 character integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-character-v05.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cats-character-v05
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update character metadata and game version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("const V='0.4.0'", "const V='0.5.0'", 1)
          old="luna:{name:'ルナ',fur:'#363d50',dark:'#1e2535',light:'#f0eadf',eye:'#e7bf63',pat:'tuxedo',face:'sleepy',acc:'ribbon',accC:'#a991ff',s:{food:3,play:8,care:5,craft:4},dream:'play',trait:'sleepy',traitN:'眠り好き',traitT:'休憩が得意。仕事中に座り込むことがある。',quote:'急がない。毛糸は逃げない。'},"
          new="luna:{name:'ルナ',fur:'#9b928c',dark:'#696662',light:'#f4eee6',eye:'#2b1e1b',pat:'silver',face:'sleepy',acc:'ribbon',accC:'#a88be8',s:{food:3,play:8,care:5,craft:4},dream:'play',trait:'sleepy',traitN:'眠り好き',traitT:'休憩が得意。仕事中に座り込むことがある。',quote:'急がない。毛糸は逃げない。'},"
          assert old in s, 'Luna metadata block not found'
          s=s.replace(old,new,1)
          old="toto:{name:'トト',fur:'#d8d0c3',dark:'#7e8792',light:'#f7f1e7',eye:'#4c806f',pat:'gray',face:'soft',acc:'apron',accC:'#ff8251',s:{food:4,play:3,care:8,craft:5},dream:'care',trait:'caretaker',traitN:'世話焼き',traitT:'同じ店で働く猫のごきげんを支える。',quote:'乱れた毛は、放っておけない。'},"
          new="toto:{name:'トト',fur:'#171719',dark:'#09090b',light:'#f6eee4',eye:'#251d18',pat:'tuxedo',face:'serious',acc:'scarf',accC:'#d84c3f',s:{food:4,play:3,care:8,craft:5},dream:'care',trait:'caretaker',traitN:'しっかり者',traitT:'仲間をよく見ていて、同じ店の猫のごきげんを支える。',quote:'見回りは任せて。'},"
          assert old in s, 'Toto metadata block not found'
          s=s.replace(old,new,1)
          old="mimi:{name:'ミミ',fur:'#f0d7b6',dark:'#9f6e52',light:'#fff1dc',eye:'#6b4a72',pat:'calico',face:'curious',acc:'cap',accC:'#d8ef72',s:{food:5,play:5,care:3,craft:9},dream:'craft',trait:'boxLover',traitN:'箱好き',traitT:'ものづくりが得意。届いた箱に入ることがある。',quote:'完成した箱は、まず自分で試す。'}"
          new="mimi:{name:'ミミ',fur:'#e8a25d',dark:'#9f6e43',light:'#fff2dc',eye:'#2a211c',pat:'orangeWhite',face:'curious',acc:'goggles',accC:'#b47a28',s:{food:5,play:5,care:3,craft:9},dream:'craft',trait:'boxLover',traitN:'冒険好き',traitT:'ものづくりが得意。新しい道具や箱を見るとすぐ試したくなる。',quote:'次はどこを見に行く？'}"
          assert old in s, 'Mimi metadata block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Add plush sprite presentation rules
        run: |
          if ! grep -Fq 'V05_CHARACTER_ART_START' styles.css; then
            cat >> styles.css <<'CSS'

          /* V05_CHARACTER_ART_START */
          .catSprite{
            object-fit:contain;
            object-position:center bottom;
            image-rendering:auto;
            filter:drop-shadow(0 7px 9px #120a0738);
          }
          .cat .catSprite{
            width:100%;
            height:100%;
            transform-origin:50% 88%;
          }
          .floor .cat{
            width:82px;
            height:98px;
          }
          .floor .cat .catSprite{
            width:78px;
            height:92px;
          }
          .cat.idle .catSprite{animation:catPlushBreath 2.8s ease-in-out infinite}
          @keyframes catPlushBreath{
            0%,100%{transform:translateY(0) scale(1)}
            50%{transform:translateY(-2px) scale(1.012)}
          }
          .cat[data-cat="luna"] .catSprite{filter:drop-shadow(0 7px 9px #120a0738) saturate(.97)}
          .cat[data-cat="toto"] .catSprite{filter:drop-shadow(0 7px 9px #120a0738) contrast(1.03)}
          .cat[data-cat="mimi"] .catSprite{filter:drop-shadow(0 7px 9px #120a0738) saturate(1.04)}
          /* V05_CHARACTER_ART_END */
          CSS
          fi

      - name: Validate v0.5 integration
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "const V='0.5.0'" app.js
          grep -Fq "acc:'goggles'" app.js
          grep -Fq "pat:'tuxedo',face:'serious'" app.js
          grep -Fq 'V05_CHARACTER_ART_START' styles.css
          for f in mugi luna toto mimi; do
            test -s "assets/illustrations/cat-${f}.webp"
          done

      - name: Commit integration and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css
          git rm .github/workflows/apply-character-v05.yml
          git commit -m 'integrate approved plush cat characters v0.5'
          git pull --rebase origin main
          git push origin HEAD:main
