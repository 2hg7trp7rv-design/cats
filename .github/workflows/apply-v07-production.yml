name: Apply Cat's tower V0.7 production pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v07-production.yml

permissions:
  contents: write

concurrency:
  group: cats-v07-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image runtime
        run: python3 -m pip install --quiet pillow

      - name: Apply V0.7 migration
        run: python3 scripts/apply_v07.py

      - name: Validate V0.7 contract
        run: |
          set -euo pipefail
          node --check app.js
          node --check tests/character-visual-v07.mjs
          grep -q "const V='0.7.0'" app.js
          ! grep -q "raw.githubusercontent.com/2hg7trp7rv-design/cats/main/assets/illustrations/cat-" app.js
          ! grep -q "RASTER_ART_V03_START" styles.css
          ! grep -q "V04_MOBILE_VISUAL_FIX_START" styles.css
          ! grep -q "V05_CHARACTER_ART_START" styles.css
          grep -q "CHARACTER_VISUAL_V07_START" styles.css
          ! grep -q "visual-fix-v04.css" index.html
          ! grep -q "character-assets-v06.js" index.html
          test -s assets/illustrations/cat-mugi.v070.webp
          test -s assets/illustrations/cat-luna.v070.webp
          test -s assets/illustrations/cat-toto.v070.webp
          test -s assets/illustrations/cat-mimi.v070.webp

      - name: Commit migration and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "2hg7trp7rv-design"
          git config user.email "2hg7trp7rv@privaterelay.appleid.com"
          git add -A
          git rm .github/workflows/apply-v07-production.yml
          git commit -m "rebuild character asset pipeline for V0.7"
          git push origin HEAD:main
