name: Apply Living Tower V0.9.1 tuning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-living-v091-tuning.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cats-living-v091-tuning
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Living Tower slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); text=p.read_text()
              n=text.count(old)
              if count is not None and n != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, got {n}')
              if n == 0:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(text.replace(old,new))

          replace('app.js', "const V='0.9.0';", "const V='0.9.1';", 1)
          replace('app.js', "return{id:`${type}-${number}`,number,type,level:1,catId:type==='food'?'mugi':null,stock:cfg?cfg.batch:0,nextSale:Date.now()+3500,specialization:null,prepared:0};", "return{id:`${type}-${number}`,number,type,level:1,catId:type==='food'?'mugi':null,stock:type==='food'?0:(cfg?cfg.batch:0),nextSale:Date.now()+3500,specialization:null,prepared:0};", 1)
          replace('styles.css', '.catButton.mugi{left:38%;bottom:0;width:31%;height:84%}', '.catButton.mugi{left:35%;bottom:-1%;width:36%;height:92%}', 1)
          replace('index.html', 'manifest.webmanifest?v=090', 'manifest.webmanifest?v=091', 1)
          replace('index.html', 'styles.css?v=090', 'styles.css?v=091', 1)
          replace('index.html', 'V0.9.0 · LIVING TOWER VERTICAL SLICE', 'V0.9.1 · LIVING TOWER VERTICAL SLICE', 1)
          replace('index.html', 'app.js?v=090', 'app.js?v=091', 1)
          replace('sw.js', "const CACHE='cats-tower-living-v09';", "const CACHE='cats-tower-living-v091';", 1)
          replace('sw.js', '/styles.css?v=090', '/styles.css?v=091', 1)
          replace('sw.js', '/app.js?v=090', '/app.js?v=091', 1)
          replace('sw.js', '/manifest.webmanifest?v=090', '/manifest.webmanifest?v=091', 1)
          replace('tests/living-v09.mjs', "await page.locator('.floor.food .roomAction').tap();\nawait page.locator('#modal [data-action=\"prep\"]').tap();\nawait page.locator('#prepTrack').waitFor({state:'visible',timeout:5000});", "await page.locator('.floor.food .roomAction').tap();\nconst prepTrack=page.locator('#prepTrack');\nif(!(await prepTrack.isVisible().catch(()=>false))){await page.locator('#modal [data-action=\"prep\"]').tap()}\nawait prepTrack.waitFor({state:'visible',timeout:5000});", 1)
          replace('.github/workflows/verify-main.yml', "grep -q \"const V='0.9.0'\" app.js", "grep -q \"const V='0.9.1'\" app.js", 1)
          PY

      - name: Validate patched files
        run: |
          set -euo pipefail
          node --check app.js
          node --check tests/living-v09.mjs
          grep -q "const V='0.9.1'" app.js
          grep -q "V0.9.1" index.html
          grep -q "cats-tower-living-v091" sw.js
          grep -q "stock:type==='food'?0" app.js
          ! grep -q "V0.9.0" index.html

      - name: Commit tuning and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "2hg7trp7rv-design"
          git config user.email "2hg7trp7rv@privaterelay.appleid.com"
          git add app.js styles.css index.html sw.js tests/living-v09.mjs .github/workflows/verify-main.yml
          git rm .github/workflows/apply-living-v091-tuning.yml
          git commit -m "tune Living Tower V0.9.1 mobile vertical slice"
          git push origin HEAD:main
