name: Finalize Cat's tower raster art

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-raster-art.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-cats-raster-art
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate the raster art when the first pass has not committed it
        run: |
          set -euo pipefail
          if [ -f scripts/generate_raster_art.py ]; then
            python -m pip install --disable-pip-version-check pillow==11.3.0
            python scripts/generate_raster_art.py
          fi

      - name: Validate the production game art
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq "const V='0.3.0'" app.js
          grep -Fq "catSprite" app.js
          grep -Fq "assets/illustrations/enemy-robot.webp" app.js
          grep -Fq "RASTER_ART_V03_START" styles.css
          test -s assets/illustrations/title-hero.webp
          test -s assets/illustrations/cat-mugi.webp
          test -s assets/illustrations/cat-luna.webp
          test -s assets/illustrations/cat-toto.webp
          test -s assets/illustrations/cat-mimi.webp
          test -s assets/illustrations/enemy-shadow.webp
          test -s assets/illustrations/enemy-robot.webp
          test -s assets/illustrations/enemy-burglar.webp
          test -s assets/illustrations/room-lobby.webp
          test -s assets/illustrations/room-home.webp
          test -s assets/illustrations/room-food.webp
          test -s assets/illustrations/room-play.webp
          test -s assets/illustrations/room-care.webp
          test -s assets/illustrations/room-craft.webp

      - name: Commit final raster build and remove all staging files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js assets/illustrations
          git rm -r --ignore-unmatch scripts/raster_lite_parts scripts/raster_payload_parts scripts/raster_assets_parts
          git rm --ignore-unmatch scripts/generate_raster_art.py .github/workflows/apply-raster-art.yml .github/workflows/repair-raster-art.yml
          if git diff --cached --quiet; then
            echo "Raster build is already current"
          else
            git commit -m "replace SVG prototype art with raster game illustrations"
            git push origin HEAD:main
          fi
