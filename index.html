<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="昼は小さな猫たちの店。夜はみんなで守る家。猫の暮らす塔を育てるモバイルゲーム。">
  <title>Cat's tower</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=080">
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="splash" class="splash">
      <img class="splashArt" src="/assets/v080/title-live-v080.webp" alt="夜の街に建つ猫たちのタワー">
      <div class="splashShade"></div>
      <div class="splashCopy">
        <span class="kicker">A LIVING TOWER FOR LITTLE CATS</span>
        <h1><span>Cat's</span><span>tower</span></h1>
        <p>昼は、小さな猫たちの店。<br>夜は、みんなで守る家。</p>
        <button id="startBtn" class="primaryButton">タワーへ行く</button>
        <small>V0.8 · LIVING TOWER VERTICAL SLICE</small>
      </div>
    </section>

    <section id="game" class="game hidden">
      <header class="topbar">
        <button id="brandBtn" class="brand" aria-label="Cat's towerの情報">
          <span class="pawMark"><i></i><i></i><i></i><i></i><b></b></span>
          <span><strong>Cat's tower</strong><small>LIVING NIGHT TOWER</small></span>
        </button>
        <div class="topActions">
          <button id="coinBtn" class="resource" aria-label="コイン"><i>¢</i><span><b id="coins">0</b><small id="incomeText">自動営業</small></span></button>
          <button id="menuBtn" class="iconButton" aria-label="設定">•••</button>
        </div>
      </header>

      <button id="contextBar" class="contextBar">
        <span id="contextIcon" class="contextIcon">◎</span>
        <span><small>NOW IN THE TOWER</small><strong id="contextText">ムギの店を見に行こう</strong></span>
        <b>›</b>
      </button>

      <section class="world">
        <div class="nightBackdrop" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="towerScroll" class="towerScroll"><div id="tower" class="tower"></div></div>
        <button id="overviewBtn" class="overviewButton"><span>▦</span><small>全体</small></button>
      </section>

      <nav id="bottomNav" class="bottomNav" aria-label="メインメニュー">
        <button class="active" data-nav="tower"><i>▥</i><span>タワー</span></button>
        <button data-nav="cats"><i>●</i><span>猫</span></button>
        <button class="buildNav" data-nav="build"><i>＋</i><span>増築</span></button>
        <button data-nav="memories"><i>▣</i><span>思い出</span><b id="memoryBadge" class="badge hidden">1</b></button>
      </nav>
    </section>

    <div id="modal" class="modal"></div>
    <div id="toastArea" class="toastArea"></div>
    <template id="sheetTemplate">
      <div class="modalShade" data-close="1">
        <section class="sheet" role="dialog" aria-modal="true">
          <span class="sheetHandle"></span>
          <header><div><small></small><h2></h2></div><button data-close="1" aria-label="閉じる">×</button></header>
          <div class="sheetBody"></div>
        </section>
      </div>
    </template>
  </main>
  <script src="/app.js?v=080"></script>
</body>
</html>
