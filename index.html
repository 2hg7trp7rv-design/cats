<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="猫たちが自動で塔を駆け上がり、天敵と戦い、夜明けを重ねて強くなる縦型放置RPG。">
  <title>Cat's tower</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preload" as="image" href="/assets/v080/pixel-r2/tower-night-r2.png">
  <link rel="preload" as="image" href="/assets/v080/pixel-r2/mugi-sprites-r2.png">
  <link rel="preload" as="image" href="/assets/v080/pixel-r2/crow-sprites-r2.png">
  <link rel="stylesheet" href="/styles.css?v=081p2">
</head>
<body>
  <main id="app" class="app">
    <section id="splash" class="splash">
      <img class="splashArt pixelAsset" src="/assets/v080/pixel-r2/tower-night-r2.png" alt="月夜にそびえる猫たちの塔">
      <div class="splashShade"></div>
      <div class="splashCopy">
        <span class="kicker">A LITTLE ARMY CLIMBS AT NIGHT</span>
        <h1><span>Cat's</span><span>tower</span></h1>
        <p>猫たちは自分で進む。<br>あなたの一声で、群れはもっと強くなる。</p>
        <button id="startBtn" class="primaryButton">夜番を始める</button>
        <small>V0.8.1 · PIXEL TOWER VERTICAL SLICE</small>
      </div>
    </section>

    <section id="game" class="game hidden">
      <header class="topbar compactTopbar">
        <button id="brandBtn" class="brand" aria-label="Cat's towerの情報">
          <span class="pixelPaw" aria-hidden="true">◆</span>
          <span><strong>Cat's tower</strong><small>NIGHT CLIMB</small></span>
        </button>
        <div class="topActions">
          <button id="coinBtn" class="resource" aria-label="コイン">
            <i>¢</i><span><b id="coins">0</b><small>戦利品</small></span>
          </button>
          <button id="shardBtn" class="resource shardResource" aria-label="夜明けのかけら">
            <i>◇</i><span><b id="dawnShards">0</b><small>夜明け</small></span>
          </button>
          <button id="menuBtn" class="iconButton" aria-label="設定">•••</button>
        </div>
      </header>

      <section class="runHud" aria-label="攻略状況">
        <div><small>NOW</small><strong id="floorLabel">1F</strong></div>
        <div><small>BEST</small><strong id="bestFloor">1F</strong></div>
        <div class="dispatchReadout"><small>出撃中</small><strong><span id="catCount">0</span>匹</strong></div>
        <div id="dispatchGauge" class="dispatchGauge" role="progressbar" aria-label="次の自動出撃まで" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="dispatchMeter"></i></div>
      </section>

      <section id="towerBattlefield" class="towerBattlefield" aria-label="猫と天敵が戦う塔">
        <div class="towerScene">
          <img id="towerBackdrop" class="towerBackdrop pixelAsset" src="/assets/v080/pixel-r2/tower-night-r2.png" alt="六つの階が連なる月夜の塔" draggable="false">
          <div class="battleVignette" aria-hidden="true"></div>
          <div class="enemyHud">
            <div><span id="enemyMark">WILD</span><strong id="enemyName">夜ガラス</strong><small id="enemyHpText">HP 0 / 0</small></div>
            <div id="enemyHpTrack" class="enemyHpTrack" role="progressbar" aria-label="天敵の残り体力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="enemyHp"></i></div>
          </div>
          <button id="supportNode" class="supportNode hidden" data-action="open-support"></button>
          <div id="unitLayer" class="unitLayer" aria-hidden="true"></div>
          <div id="effectLayer" class="effectLayer" aria-hidden="true"></div>
          <div id="floorCallout" class="floorCallout hidden" aria-hidden="true"></div>
        </div>
        <button id="tapDispatch" class="dispatchButton" data-action="dispatch-cat">
          <span class="dispatchIcon" aria-hidden="true">!</span>
          <span><strong>猫を呼ぶ</strong><small>タップで追加出撃 · 敵を直接攻撃しません</small></span>
        </button>
      </section>

      <section id="upgradePanel" class="upgradeDock" aria-label="戦力強化">
        <button class="upgradeButton" data-action="upgrade-mugi" data-upgrade="mugi">
          <span>ムギ</span><strong id="mugiLevel">Lv.1</strong><small id="mugiCost">10¢</small>
        </button>
        <button class="upgradeButton" data-action="upgrade-weapon" data-upgrade="weapon">
          <span>猫パンチ</span><strong id="weaponLevel">Lv.1</strong><small id="weaponCost">18¢</small>
        </button>
        <button class="upgradeButton" data-action="upgrade-dispatch" data-upgrade="dispatch">
          <span>出撃口</span><strong id="dispatchLevel">Lv.1</strong><small id="dispatchCost">24¢</small>
        </button>
      </section>

      <button id="dawnButton" class="dawnButton hidden" data-action="open-dawn">
        <span>夜明けを迎える</span><small id="dawnRewardPreview">今なら ◇0</small>
      </button>

      <nav id="bottomNav" class="bottomNav" aria-label="メインメニュー">
        <button class="active" data-nav="tower" aria-current="page"><i>▲</i><span>攻略</span></button>
        <button data-nav="cats"><i>●</i><span>猫</span></button>
        <button data-nav="support"><i>⌂</i><span>支援</span></button>
        <button data-nav="memories"><i>▣</i><span>思い出</span><b id="memoryBadge" class="badge hidden">1</b></button>
      </nav>
    </section>

    <div id="modal" class="modal"></div>
    <div id="toastArea" class="toastArea" aria-live="polite" aria-atomic="false"></div>
    <template id="sheetTemplate">
      <div class="modalShade" data-close="1">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
          <span class="sheetHandle"></span>
          <header><div><small></small><h2 id="sheetTitle"></h2></div><button data-close="1" aria-label="閉じる">×</button></header>
          <div class="sheetBody"></div>
        </section>
      </div>
    </template>
  </main>
  <script src="/game-data.js?v=081p2"></script>
  <script src="/game-core.js?v=081p2"></script>
  <script src="/app.js?v=081p2"></script>
</body>
</html>
