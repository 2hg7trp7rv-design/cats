<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#081728">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ぬいぐるみのような猫たちと、縦に伸びるタワーを育てるスマートフォン専用ゲーム。">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/visual-fix-v04.css?v=4">
  <title>Cat's tower</title>
</head>
<body>
  <aside class="unsupported" aria-hidden="true"><div><b>Cat's tower</b><p>スマートフォンの縦画面で開いてください。</p></div></aside>
  <main id="app" class="app">
    <section id="splash" class="splash">
      <div class="rain"></div><div class="skyline"></div>
      <div class="splashTower"><i></i><i></i><i></i><i></i><div id="splashCat"></div></div>
      <div class="splashCopy"><small>A TINY TOWER FOR SOFT LITTLE CATS</small><h1><span>Cat's</span><span>tower</span></h1><p>店をひらいて、猫を迎えて、<br>夜のタワーを守ろう。</p><button id="startBtn" class="bigBtn">管理をはじめる</button><em>V0.6 · CHARACTER ASSET FIX</em></div>
    </section>
    <section id="game" class="game hidden">
      <header class="topbar"><div class="brand"><i></i><span>Cat's tower<small>NIGHT CARE TOWER</small></span></div><div class="resources"><button id="coinsBtn" aria-label="コイン"><i class="coin">¢</i><span><b id="coins">0</b><small id="incomeRate">+1 / 秒</small></span></button><button id="partsBtn" aria-label="部品"><i class="part">⌁</i><span><b id="parts">0</b><small>防衛報酬</small></span></button></div></header>
      <button id="guideBar" class="guideBar"><i id="guideIcon">◎</i><span id="guideText">タワーを育てよう</span><b>›</b></button>
      <section class="world"><button id="battleCall" class="battleCall hidden" type="button" aria-label="夜間防衛を開始"><i>!</i><span><small>INVASION READY</small><b id="battleCallText">初回防衛を開始</b></span><em>開始</em></button><div class="backdrop"><i class="moon"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="buildings"></i><i class="rain worldRain"></i></div><div id="towerScroll" class="towerScroll"><div id="tower" class="tower"></div></div><button id="topBtn" class="topBtn"><b id="topFloor">3F</b><small>TOP</small></button><div id="toasts" class="toasts"></div></section>
      <nav id="nav" class="nav"><button data-nav="tower" class="on"><i>▥</i><span>タワー</span></button><button data-nav="cats"><i>◉</i><span>猫</span></button><button data-nav="build" class="build"><i>＋</i><span>増築</span></button><button data-nav="tasks"><i>✓</i><span>タスク</span><b id="taskBadge" class="badge hidden">0</b></button><button data-nav="menu"><i>•••</i><span>メニュー</span></button></nav>
      <nav id="battleNav" class="battleNav hidden"><button data-tool="yarn"><i class="yarnIcon"></i><span>毛糸網</span><small>25</small></button><button data-tool="static"><i class="staticIcon">ϟ</i><span>静電毛玉</span><small>35</small></button><button data-tool="box"><i class="boxIcon">□</i><span>段ボール</span><small>40</small></button><button data-tool="magnet"><i class="magnetIcon">∩</i><span>磁石</span><small>30</small></button><button id="pauseBtn"><i>Ⅱ</i><span>停止</span><small id="energy">100</small></button></nav>
    </section>
    <div id="modal" class="modal"></div><div id="coach" class="coach"></div>
  </main>
  <template id="sheetTpl"><div class="shade" data-close="1"><section class="sheet" role="dialog" aria-modal="true"><i class="handle"></i><header><div><small></small><h2></h2></div><button data-close="1">×</button></header><div class="sheetBody"></div></section></div></template>
  <script src="/app.js" defer></script>
  <script src="/character-assets-v06.js?v=6" defer></script>
</body>
</html>
